[project]
name = "kp-datasets"
version = "0.1.0"
description = "KlusAI Privacy datasets — sourcing, synthetic generation, normalization, and HF publishing"
requires-python = ">=3.13"
dependencies = [
    "datasets>=4.0",
    "huggingface-hub>=0.25,<2",
    "pyyaml>=6.0,<7",
    "pydantic>=2.0,<3",
    "click>=8.1,<9",
    # Single source of truth for the harmonized taxonomy + span alignment. Pulled from the public
    # GitHub repo so `pip install` works for outside users; local dev overrides with the sibling
    # editable (see Makefile). Pin to a tag once europriv-bench cuts releases.
    "europriv-bench @ git+https://github.com/klusai/europriv-bench.git",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.11", "coverage>=7.0"]
# RES-95 stage-B RO narrative generation: a LOCAL, OFFLINE LLM authors document bodies (no network,
# no API key). mlx-lm loads the model from the on-disk HF cache. Optional so the repo's core
# (splice + span validation + tests) stays dependency-free; only batch generation needs it.
stageb = ["mlx-lm>=0.20"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["klusai*"]
namespaces = true        # PEP 420: klusai/ and klusai/privacy/ carry no __init__.py

[tool.setuptools.package-data]
# RES-72 EN real-skeleton scaffold: mined CJEU layout signatures (structure-only, no source prose).
"klusai.privacy.datasets.data.res72" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["klusai.privacy.datasets"]
