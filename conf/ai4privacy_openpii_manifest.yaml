# Ai4Privacy open-core ingestion manifest (RES-93)
# ----------------------------------------------------------------------------------------------
# This manifest records the LICENSE-GATE verification and the content checksums for the
# Ai4Privacy held-out eval slices curated for the EuroPriv-Bench `ai4privacy-openpii-*-v1`
# external-synthetic detection track. The gold JSONL itself is NOT committed (artifacts/ is
# gitignored — gold is pulled/curated at eval time, per the harness convention); this manifest is
# the committed, auditable record of WHAT was ingested, from WHERE, and under WHICH license.

source:
  hf_id: ai4privacy/pii-masking-openpii-1m
  hf_url: https://huggingface.co/datasets/ai4privacy/pii-masking-openpii-1m
  split_used: validation            # disjoint from `train`; carved further per language (see slices)
  schema: [source_text, masked_text, privacy_mask, split, uid, language, region, script]
  span_field: privacy_mask          # [{label, start, end, value, label_index}], char offsets

# --- LICENSE GATE (verified live against the raw README, 2026-06-07) --------------------------
license:
  verified_on: "2026-06-07"
  method: "raw README YAML front-matter + full card body, fetched live"
  yaml_license: other               # the HF `license:` field is the generic `other`
  yaml_license_name: cc-by-4.0      # cosmetic display name; NOT load-bearing on its own
  effective: CC-BY-4.0              # the BODY states the actual grant (quoted below)
  clean: true                       # passes the program license gate (commercial + derivative + redistribution)
  body_quote: >
    "License: CC-BY-4.0. Copyright (c) 2026 Ai Suisse SA. Permitted Use: Research, commercial
    use, redistribution, and modification — subject to attribution requirements under CC-BY-4.0.
    Attribution: When using this dataset, please credit 'Ai4Privacy / Ai Suisse SA' and link to
    this repository."
  llama_clause_present: false       # the word "Llama" appears NOWHERE in the openpii-1m card
  attribution_required: "Ai4Privacy / Ai Suisse SA (CC-BY-4.0)"

# --- EXCLUDED tiers (verified Llama-bound / custom-restrictive — DO NOT ingest) ----------------
excluded_tiers:
  - hf_id: ai4privacy/open-pii-masking-500k-ai4privacy
    reason: >
      Llama-Community-License-bound. Card body: "This dataset, Open PII Masking 500k, was created
      using Llama models (versions 3.1 and 3.3) ... its use and distribution are subject to the
      Llama Community License Agreement." Requires "Built with Llama" attribution + a "Llama"
      model-name prefix on derivatives. Excluded by program policy (eval-only at most). NOTE its
      YAML still says `license_name: cc-by-4.0`, which is misleading — the body is the binding term.
    verdict: EXCLUDED
  - hf_id: ai4privacy/pii-masking-300k
    reason: >
      Custom `license.md` (YAML `license_name: license.md`). Body: "Commercial entities should
      contact us at licensing@ai4privacy.com." Company-size-tiered; not cleanly redistributable.
    verdict: EXCLUDED
  - hf_id: ai4privacy/pii-masking-200k
    reason: >
      Custom company-size-tiered license.md (free for independents / 2-3 employee firms; larger
      orgs require a paid company license). Not cleanly redistributable.
    verdict: EXCLUDED

