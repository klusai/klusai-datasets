# --- Contamination policy (honest train/eval overlap) -----------------------------------------
# Ai4Privacy is a training substrate elsewhere on the board: openmed + tabularisai were trained on
# Ai4Privacy data, so they score these `ai4privacy-openpii-*-v1` configs as `in_distribution`
# (NOT a fair held-out measurement for them). kp-deid (trained on KP LocalePacks ro/en/pl only) is
# clean_held_out on these distinct-generator Ai4Privacy configs (genuine zero-shot). The rule-based /
# third-party systems (presidio/spacy/gliner/gliner2) are clean_held_out on every config.
# Enforced in europriv_bench.leaderboard.classify_contamination.
contamination_substrate_adapters: [openmed, tabularisai]
