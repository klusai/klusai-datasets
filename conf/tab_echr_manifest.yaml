# TAB (Text Anonymization Benchmark) ingestion manifest — RES-89
# ----------------------------------------------------------------------------------------------
# The committed, auditable record of WHAT was ingested, from WHERE, under WHICH license, and the
# entity_type→KP + DIRECT/QUASI/NO_MASK crosswalk used. The gold JSONL itself is NOT committed
# (artifacts/ is gitignored — gold is curated/pulled at eval time, per the harness convention);
# this manifest + the checksums are the durable provenance. Curated by scripts/curate_tab.py.
#
# TAB is the program's FIRST real-data gold anchor: 1,268 REAL English ECHR court judgments,
# manually annotated, peer-reviewed (Pilán et al. 2022, Computational Linguistics 48(4)).

source:
  name: Text Anonymization Benchmark (TAB)
  url: https://github.com/NorskRegnesentral/text-anonymization-benchmark
  raw_base: https://raw.githubusercontent.com/NorskRegnesentral/text-anonymization-benchmark/master
  files: [echr_train.json, echr_dev.json, echr_test.json]
  citation: >
    Ildikó Pilán, Pierre Lison, Lilja Øvrelid, Anthi Papadopoulou, David Sánchez, Montserrat Batet.
    "The Text Anonymization Benchmark (TAB): A Dedicated Corpus and Evaluation Framework for Text
    Anonymization." Computational Linguistics 48(4):1053-1101, 2022 (MIT Press, peer-reviewed).
  corpus: 1268 real English ECHR (HUDOC) court judgments; manually annotated; 155,006 mentions.
  schema: >
    Per doc: {text, doc_id, annotations{<annotator>: {entity_mentions:[...]}}, quality_checked,
    meta, task, dataset_type}. Per mention: entity_type, start_offset, end_offset (CHARACTER
    offsets — verified text[start:end]==span_text exactly, 0 mismatches across all 155k mentions),
    span_text, identifier_type (DIRECT/QUASI/NO_MASK), entity_id (co-reference), confidential_status.

# --- LICENSE GATE (verified live against the repo, 2026-06-07) --------------------------------
license:
  verified_on: "2026-06-07"
  spdx: MIT
  effective: MIT
  clean: true                       # passes the program license gate (commercial + derivative + redistribution)
  evidence: >
    LICENSE.txt in the repo is VERBATIM "The MIT License (MIT) / Copyright (C) 2021-2026 Norsk
    Regnesentral" (sha256 9569b31acf50e1cb3f38f47220f2c3a42f533e07e72fe2d18c2871e89098a8c7); the
    GitHub repository SPDX id is MIT. The MIT grant covers the data JSON.
  not_cc_by: >
    The widely-repeated "CC-BY-4.0" attribution is WRONG for the DATA: CC-BY-4.0 covers only the
    journal ARTICLE (via the ACL Anthology / MIT Press), NOT the echr_*.json corpus. Cite + tag the
    data as MIT, never CC-BY. (MIT is in the license-gate _CLEAN allowlist; see test_licensing.)
  upstream_provenance: >
    The underlying judgments are public European Court of Human Rights documents (© Council of
    Europe / ECHR-CEDH, via HUDOC). TAB redistributes them under MIT; no additional redistribution
    restriction is introduced. Noted in the dataset card for caution/explicitness.

# --- Crosswalk: TAB entity_type → harmonized KP taxonomy (`tab` scheme) ------------------------
# Authored in europriv_bench/conf/taxonomy.yaml (single source of truth). Only DIRECT+QUASI
# mentions are kept (NO_MASK is not a detection target). Unmapped TAB types are dropped + counted
# (honest coverage — no silent truncation, no inflation).
entity_type_crosswalk:
  PERSON:   PERSON        # → KP PERSON       (direct identifier)
  CODE:     CASE_NUMBER   # → KP CASE_NUMBER  (ECHR application/case numbers, e.g. "36110/97")
  LOC:      ADDRESS       # → KP ADDRESS      (cities/countries/regions)
  ORG:      ORG_PARTY     # → KP ORG_PARTY    (courts, prosecutors, institutions, companies)
  DATETIME: DATE          # → KP DATE         (dates/times/date-ranges)
  DEM:      null          # demographic (nationality/religion/profession) — no clean KP type, DROPPED
  QUANTITY: null          # quantities/areas — no clean KP type, DROPPED
  MISC:     null          # misc descriptors — no clean KP type, DROPPED

# --- identifier_type → program direct/quasi re-identification framing -------------------------
# TAB's masking-aware identifier_type is preserved PER SPAN (field `identifier_type`) so it can be
# read as an external-validation substrate for the QI / residual-distinctiveness channel (RES-88 /
# RES-17): a natural, peer-reviewed mapping onto the program's own direct-identifier vs
# quasi-identifier distinction. TAB co-reference (`entity_id`) is also preserved per span.
identifier_type_mapping:
  DIRECT:  direct-identifier        # identifies the individual on its own → KP IdentifierClass.DIRECT
  QUASI:   quasi-identifier         # identifies in combination (residual-distinctiveness / re-id risk)
  NO_MASK: not-a-target             # not an anonymisation target → dropped from gold spans

# --- Curation method --------------------------------------------------------------------------
curation:
  script: scripts/curate_tab.py
  annotator_selection: >
    One canonical annotator per document: first quality_checked annotator, else first by name.
    (TAB dev/test carry up to 10 annotators; its own eval micro-averages recall over annotators,
    but the harness gold is a single non-overlapping BIOES sequence per doc.)
  nested_spans: longest-wins  # TAB legitimately nests mentions; keep the outermost, drop sub-spans
  alignment: byte-equality + strict BIOES via europriv_bench.spans (fail loud; misaligned docs dropped+counted)
  misaligned_cause: >
    The few dropped docs are NOT offset errors (TAB offsets are exact). They are sub-token
    annotations — two char-disjoint TAB mentions inside one whitespace token (e.g.
    "14553-14554/89" → two CASE_NUMBERs) — which a whitespace-token BIOES cannot represent. Dropped
    + counted rather than shipping misaligned gold (per the RES-89 guard).

