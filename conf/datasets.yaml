# Registry of KP datasets: sources, domains, languages, licenses.
# Only cleanly-licensed sources are eligible for the redistributable benchmark.

sources:
  # RES-93 LICENSE GATE (verified live 2026-06-07 against each repo's raw README YAML + body):
  #   * ai4privacy/open-pii-masking-500k-ai4privacy → YAML `license: other`, `license_name:
  #     cc-by-4.0`, BUT the card body binds it to the **Llama Community License Agreement**
  #     ("created using Llama models (versions 3.1 and 3.3) ... use and distribution are subject
  #     to the Llama Community License Agreement"; "Built with Llama" attribution + model-naming
  #     obligation). Llama-bound → EXCLUDED by program policy (the license gate rejects `llama`).
  #   * ai4privacy/pii-masking-300k / -200k → custom `license.md` (company-size-tiered, commercial
  #     entities must email licensing@ai4privacy.com) → NOT cleanly redistributable → EXCLUDED.
  #   * ai4privacy/pii-masking-openpii-1m → YAML `license: other`, `license_name: cc-by-4.0`, and
  #     the body states plainly: "License: CC-BY-4.0. Copyright (c) 2026 Ai Suisse SA. Permitted
  #     Use: Research, commercial use, redistribution, and modification — subject to attribution
  #     requirements under CC-BY-4.0." The word "Llama" appears NOWHERE in the card. → CLEAN.
  # We therefore repoint the source to the clean openpii-1m repo. The gate now blocks the 500k repo
  # (test_licensing::test_ai4privacy_500k_llama_tier_blocked) so this can never silently regress.
  # The verified license + a content checksum live in conf/ai4privacy_openpii_manifest.yaml.
  ai4privacy-openpii:
    hf_id: ai4privacy/pii-masking-openpii-1m
    license: CC-BY-4.0        # verified clean open core; the 500k tier is Llama-bound (excluded)
    license_verified: "2026-06-07"
    manifest: conf/ai4privacy_openpii_manifest.yaml
    domain: general
    role: train               # train | gold-eval | weak-supervision
  tab-echr:
    url: https://github.com/NorskRegnesentral/text-anonymization-benchmark
    license: open
    domain: legal
    role: gold-eval
  meddocan:
    url: https://zenodo.org/records/4279323
    license: open-synthetic
    domain: clinical
    role: gold-eval
  eurlex:
    hf_id: dennlinger/eur-lex-sum
    license: CC-BY-SA-4.0
    domain: legal
    role: weak-supervision
  # KLU-111 legal real-skeleton track — STRUCTURE-ONLY source-license verification (no text reused).
  # We author original legal-document skeletons that mirror the public SECTION LAYOUT of these
  # source types; no copyrighted source text is included or redistributed (verified each license):
  eurlex-structure:
    url: https://eur-lex.europa.eu/
    # EUR-Lex general reuse of Commission documents is authorised under Commission Decision
    # 2011/833/EU (reuse + attribution, no exclusive rights). We rely only on the uncopyrightable
    # section-layout convention, so even this permission is not load-bearing.
    license: "Decision-2011/833/EU (EUR-Lex reuse) — structure-only, no text redistributed"
    domain: legal
    role: structure-only
  echr-hudoc-structure:
    url: https://hudoc.echr.coe.int/
    # ECHR/HUDOC reuse is permitted only for "private use or information and education" with
    # © ECHR-CEDH attribution, and HUDOC translations are copyright-protected — this is NOT cleanly
    # redistributable under the program's license gate, so NO ECHR/HUDOC TEXT is included. We
    # reproduce only the (uncopyrightable) judgment STRUCTURE: caption → facts → law → operative.
    license: "© ECHR-CEDH (restricted reuse) — structure-only, NO text redistributed"
    domain: legal
    role: structure-only

# Synthetic datasets we generate. Named ds-kp-{domain}-{lang}-{size}. Released volumes (SLUGs) are
# built from per-locale LocalePack generators (PACKs) via scripts/release_dataset.py: each row
# carries gold spans emitted at generation time (byte-equality + strict BIOES), CC-BY-4.0, no real
# data subject. Legal/clinical real-structure synthesis is H2.
#
# Contamination pre-declaration (the KLU-51/54 trap): every synthetic config below is intended to
# become kp-deid-v2 TRAINING data (KLU-106). Therefore any model trained on a given config MUST
# score the MATCHING general benchmark config as contamination=in_distribution — these are not a
# held-out evaluation set for such a model. The per-config `contamination_role: train` flag below
# (and the matching note in each dataset card emitted by scripts/release_dataset.py) records this so
# KLU-106 cannot silently score in-distribution as if it were held-out.
synthetic:
  # Stage-A general-domain bring-up — published (50k each, validation PASS).
  - { name: ds-kp-general-ro-50k, domain: general, language: ro, n: 50000, pack: ro, license: CC-BY-4.0, contamination_role: train }
  - { name: ds-kp-general-en-50k, domain: general, language: en, n: 50000, pack: en, license: CC-BY-4.0, contamination_role: train }
  - { name: ds-kp-general-pl-50k, domain: general, language: pl, n: 50000, pack: pl, license: CC-BY-4.0, contamination_role: train }
  # T1 multilingual breadth (KLU-102 — generate + validate here; publishing to HF is KLU-107).
  # IT is the critical-path decode-bearing identifier (codice fiscale → KLU-105/106).
  - { name: ds-kp-general-it-50k, domain: general, language: it, n: 50000, pack: it, license: CC-BY-4.0, contamination_role: train }
  - { name: ds-kp-general-de-50k, domain: general, language: de, n: 50000, pack: de, license: CC-BY-4.0, contamination_role: train }
  - { name: ds-kp-general-fr-50k, domain: general, language: fr, n: 50000, pack: fr, license: CC-BY-4.0, contamination_role: train }
  - { name: ds-kp-general-es-50k, domain: general, language: es, n: 50000, pack: es, license: CC-BY-4.0, contamination_role: train }
  - { name: ds-kp-general-nl-50k, domain: general, language: nl, n: 50000, pack: nl, license: CC-BY-4.0, contamination_role: train }
  # H2 (legal/clinical real-structure synthesis).
  # KLU-111 legal real-skeleton PoC: EUR-Lex-style instrument / ECHR-style judgment / GDPR Art.15
  # DSAR response — STRUCTURE-ONLY (no source text reused), synthetic CNP-bearing PII, config_status
  # =dev, single authored family. Published as the europriv-bench `legal-realskeleton-v1` config.
  - { name: ds-kp-legal-ro-rs,     domain: legal,    language: ro, n: 1500, pack: ro-legal, license: CC-BY-4.0 }
  - { name: ds-kp-legal-ro-50k,    domain: legal,    language: ro, n: 50000 }
  - { name: ds-kp-clinical-de-20k, domain: clinical, language: de, n: 20000 }
  # RES-80 EU-breadth batch 1: decode-bearing re-id for SE/CZ — STRUCTURE-ONLY (no source text
  # reused), synthetic checksum-valid PII, config_status=dev, single authored family. Published as
  # the europriv-bench `se-realskeleton-v1` / `cz-realskeleton-v1` configs. A missed personnummer
  # (SE) / rodné číslo (CZ) deterministically discloses DATE_OF_BIRTH + SEX.
  - { name: ds-kp-se-rs, domain: mixed, language: sv, n: 1500, pack: se-realskeleton, license: CC-BY-4.0 }
  - { name: ds-kp-cz-rs, domain: mixed, language: cs, n: 1500, pack: cz-realskeleton, license: CC-BY-4.0 }
  # RES-83 EU-breadth batch 2: decode-bearing re-id for DK/FI — STRUCTURE-ONLY (no source text
  # reused), synthetic checksum/format-valid PII, config_status=dev, single authored family.
  # Published as the europriv-bench `dk-realskeleton-v1` / `fi-realskeleton-v1` configs. A missed
  # CPR-nummer (DK) / henkilötunnus (FI) deterministically discloses DATE_OF_BIRTH + SEX. NOTE: the
  # DK CPR mod-11 check was abolished in 2007 → format + century-table validation, not a checksum.
  - { name: ds-kp-dk-rs, domain: mixed, language: da, n: 1500, pack: dk-realskeleton, license: CC-BY-4.0 }
  - { name: ds-kp-fi-rs, domain: mixed, language: fi, n: 1500, pack: fi-realskeleton, license: CC-BY-4.0 }
