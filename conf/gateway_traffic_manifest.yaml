release_gates:
- RES-124 data revision 4 has 8000 test and 1600 dev; independent panel review remains pending.
- Validate schema, offsets, source rights, artifact SHA-256 and immutable split ledger.
- Refresh inventory after any KP training change; scan every corpus, never accept a partial path map.
- 'Require documented family/subject/translation disjointness review: legacy corpora have incomplete identity metadata.'
- External synthetic remains separately reported; TAB stays an independent anchor.
- Native double annotation plus adjudication on >=100 conversations/language; freeze guide after agreement/miss analysis.
- No real-traffic claim; status stays dev. Harness scoring and >=3 seeds are future work.
